<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#8C2F26">
<title>看日子 · 筠玲易數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ser:"Noto Serif TC",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --line:#d3c6b0; --zhu:#7d1d1d; --gold:#b78c39;
  --paper:#ece6da; --card:#faf8f2; --ink:#34291f; --dim:#85776c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0 0 50px;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 18px}

.back{display:inline-block;margin:16px 0 0;font-size:13px;letter-spacing:.1em;
  color:var(--dim);text-decoration:none}
.back:active{color:var(--zhu)}

header{position:relative;min-height:270px;margin:18px 0 22px;padding:34px 28px;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;
  text-align:left;overflow:hidden;border:1px solid rgba(221,184,93,.82);border-radius:22px;
  background:
    linear-gradient(90deg,rgba(47,10,65,.92) 0%,rgba(67,20,82,.69) 42%,rgba(49,9,60,.08) 72%),
    url("rz-almanac-hero.webp") center/cover no-repeat;
  box-shadow:0 18px 42px rgba(76,17,94,.22),inset 0 0 0 1px rgba(255,255,255,.28)}
header::after{content:"";position:absolute;inset:10px;border:1px solid rgba(238,207,126,.4);
  border-radius:15px;pointer-events:none}
.eyebrow{margin:0 0 8px;font-family:var(--ser);font-size:11px;letter-spacing:.4em;color:var(--zhu)}
h1{margin:0;font-family:var(--ser);font-size:30px;font-weight:900;
  letter-spacing:.28em;text-indent:.28em;color:#3f2f25}
.orn{height:1px;width:110px;margin:18px auto 0;
  background:linear-gradient(90deg,rgba(183,140,57,0),var(--gold),rgba(183,140,57,0))}

.card{background:var(--card);border:1px solid #cdbfa7;padding:22px;margin:20px 0;
  box-shadow:0 3px 10px rgba(0,0,0,.04)}
h2{position:relative;margin:0 0 18px;padding-bottom:13px;text-align:center;
  font-family:var(--ser);font-size:15px;font-weight:700;
  letter-spacing:.3em;text-indent:.3em;color:#4d3728}
h2::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:64px;height:1px;background:var(--gold)}

/* 日期選擇 */
.pick{display:flex;gap:10px;align-items:stretch}
.pick input{flex:1;height:48px;padding:0 14px;border:1px solid #bda98f;border-radius:2px;
  background:#fffefb;color:var(--ink);font-family:var(--sans);font-size:16px}
.pick input:focus{outline:none;border-color:var(--zhu);box-shadow:0 0 0 2px rgba(125,29,29,.12)}
.pick button{min-width:76px;border:0;background:var(--zhu);color:#fff;
  font-family:var(--ser);font-size:14px;letter-spacing:.16em;cursor:pointer}
.pick button:active{background:#4d1717}
.quick{display:flex;gap:8px;margin-top:12px}
.quick button{flex:1;padding:9px 4px;border:1px solid var(--line);background:transparent;
  color:#66584a;font-family:var(--ser);font-size:12.5px;letter-spacing:.1em;cursor:pointer}
.quick button:active{background:#f0e9dc}

/* 日期主體 */
.date-main{text-align:center;padding:4px 0 2px}
.date-sol{font-family:var(--ser);font-size:15px;letter-spacing:.1em;color:var(--dim)}
.date-lun{margin-top:8px;font-family:var(--ser);font-size:34px;font-weight:900;
  letter-spacing:.1em;color:#472f21}
.date-gz{margin-top:10px;font-family:var(--ser);font-size:16px;
  letter-spacing:.16em;color:var(--zhu)}
.date-jq{margin-top:10px;font-size:12.5px;color:var(--dim)}

/* 宜忌 */
.yj{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.yj>div{padding:16px 14px;background:#fffdf9;border:1px solid #ddd2c0}
.yj h3{margin:0 0 10px;text-align:center;font-family:var(--ser);
  font-size:15px;font-weight:700;letter-spacing:.2em}
.yj .y h3{color:#2f6b4f}
.yj .j h3{color:var(--zhu)}
.yj p{margin:0;font-size:13.5px;line-height:2.05;text-align:center;color:#4c443d}
@media (max-width:400px){.yj{grid-template-columns:1fr}}

/* 方位 */
.pos{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#e6ddcf;
  border:1px solid #e6ddcf}
.pos div{padding:14px 8px;text-align:center;background:#fffefb}
.pos b{display:block;font-family:var(--ser);font-size:12px;letter-spacing:.14em;color:var(--dim)}
.pos span{display:block;margin-top:5px;font-family:var(--ser);font-size:19px;
  font-weight:700;color:#5d2c20}

/* 生肖 */
.sx div{display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid #e6ddcf}
.sx div:last-child{border-bottom:0}
.sx b{flex:0 0 auto;min-width:54px;padding:3px 6px;text-align:center;
  border:1px solid currentColor;font-family:var(--ser);font-size:10.5px;
  font-weight:700;letter-spacing:.1em}
.sx .t1 b{color:#2f6b4f}
.sx .t2 b{color:var(--gold)}
.sx .t3 b{color:var(--zhu)}
.sx span{font-family:var(--ser);font-size:17px;letter-spacing:.22em;color:#4c443d}

/* 吉時 */
.hrs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#e6ddcf;
  border:1px solid #e6ddcf}
.hrs div{padding:12px 6px;text-align:center;background:#fffefb}
.hrs div.bad{background:#f6f2ea;color:#a89b8a}
.hrs b{display:block;font-family:var(--ser);font-size:16px;font-weight:700;color:#5d2c20}
.hrs div.bad b{color:#a89b8a;font-weight:400}
.hrs span{display:block;margin-top:3px;font-size:11.5px;color:var(--dim)}
.hrs em{display:block;margin-top:3px;font-style:normal;font-size:10.5px;color:#2f6b4f}
.hrs div.bad em{color:#b0a494}

.note{margin-top:14px;font-size:12px;line-height:1.9;color:var(--dim)}
.err{padding:16px;text-align:center;font-size:13.5px;color:var(--zhu)}
footer{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);
  text-align:center;font-size:11.5px;line-height:2;color:var(--dim)}

/* 看日子專用視覺：插圖只做氣氛，標題仍為真 HTML */
.jl-page-rz header .eyebrow,.jl-page-rz header h1{position:relative;z-index:1;color:#fff8e7;text-shadow:0 2px 14px rgba(26,0,33,.8)}
.jl-page-rz header .eyebrow{color:#f1cf7b;font-weight:700}
.jl-page-rz header h1{font-size:38px;letter-spacing:.22em;text-indent:0}
.jl-page-rz header .orn{position:relative;z-index:1;margin:18px 0 0;background:linear-gradient(90deg,#e7bd58,rgba(231,189,88,0))}
.hero-kicker{position:relative;z-index:1;margin:14px 0 0;max-width:230px;color:rgba(255,249,236,.86);
  font-family:var(--ser);font-size:12px;line-height:1.9;letter-spacing:.08em}
.meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meta-item{position:relative;min-height:88px;padding:15px 14px;border:1px solid #e2d2e7;border-radius:14px;
  background:linear-gradient(145deg,#fffefd,#fbf4ff);overflow:hidden}
.meta-item{padding-right:49px;box-shadow:inset 0 1px 0 #fff,0 7px 18px rgba(104,38,119,.055)}
.meta-item::after{content:"";position:absolute;width:72px;height:72px;right:-28px;bottom:-35px;
  border:1px solid rgba(185,141,45,.3);border-radius:50%}
.meta-item b{display:block;margin-bottom:5px;color:#7b287f;font-family:var(--ser);font-size:12px;letter-spacing:.12em}
.meta-item span{display:block;color:#4b3b4d;font-size:13px;line-height:1.7}
.rz-ico{width:1em;height:1em;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.rz-title-icon .rz-ico{width:17px;height:17px;vertical-align:0}
.meta-visual{position:absolute;right:11px;top:11px;width:30px;height:30px;display:grid;place-items:center;
  border:1px solid rgba(199,152,49,.48);border-radius:50%;color:#8b2995;
  background:radial-gradient(circle at 34% 28%,#fff 0 17%,#f9e8ff 48%,#ead0f3 100%);
  box-shadow:0 4px 11px rgba(111,31,126,.12),inset 0 0 0 3px rgba(255,255,255,.48)}
.meta-visual .rz-ico{width:15px;height:15px}
.detail-list{display:grid;gap:10px}
.detail-row{position:relative;padding:14px 16px 14px 52px;border-left:3px solid #c39835;border-radius:2px 12px 12px 2px;
  background:linear-gradient(90deg,#fff8de,#fffdf8 48%,#fbf5ff)}
.detail-row b{display:block;color:#6f2378;font-family:var(--ser);font-size:13px;letter-spacing:.12em}
.detail-row span{display:block;margin-top:5px;color:#5f555f;font-size:13px;line-height:1.8}
.detail-mark{position:absolute;left:14px;top:15px;width:27px;height:27px;display:grid;place-items:center;
  border-radius:9px;color:#8a2b91;background:linear-gradient(145deg,#fff,#f4dcfa);border:1px solid #e2c1e8}
.detail-mark .rz-ico{width:14px;height:14px}
.yj>div{position:relative;overflow:hidden;border-radius:17px;box-shadow:inset 0 1px 0 #fff}
.yj>div::after{content:"";position:absolute;right:-34px;bottom:-42px;width:100px;height:100px;
  border:1px solid rgba(188,143,45,.22);border-radius:50%;pointer-events:none}
.yj h3{display:flex;align-items:center;justify-content:center;gap:8px}
.yj-mark{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;font-size:20px;
  background:#eefaf4;border:1px solid #cceade;box-shadow:0 5px 14px rgba(50,107,79,.08)}
.yj .j .yj-mark{color:#8c2f3d;background:#fff1f3;border-color:#f0d2d7}
.yj-mark .rz-ico{width:18px;height:18px}
.pos{gap:10px;background:transparent;border:0}
.pos div{position:relative;min-height:116px;padding:22px 8px 16px;border:1px solid #e1cfe5;border-radius:17px;
  background:linear-gradient(150deg,#fff,#fffafd 60%,#f8effc);box-shadow:0 7px 18px rgba(101,34,118,.055)}
.pos-mark{width:32px;height:32px;margin:0 auto 9px;display:grid;place-items:center;border-radius:50%;
  color:#b18125;background:#fff9e9;border:1px solid #e6c46e}
.pos-mark .rz-ico{width:17px;height:17px}
.sx div{position:relative;margin:9px 0;padding:13px 12px;border:1px solid #e4d3e8;border-radius:15px;
  background:linear-gradient(90deg,#fff,#fdf8ff);overflow:hidden}
.sx div::after{content:"";position:absolute;right:13px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 25%,rgba(137,44,151,.08) 27% 100%)}
.sx span{position:relative;z-index:1}
.hrs{gap:10px;background:transparent;border:0}
.hrs div{position:relative;min-height:128px;padding:16px 6px 12px;border:1px solid #e1d1e4;border-radius:17px;
  background:linear-gradient(160deg,#fff,#fffafd 62%,#f6ebfa);box-shadow:0 7px 17px rgba(100,34,118,.05)}
.hrs div.bad{background:linear-gradient(160deg,#fbfaf8,#f6f2ee);border-color:#e8e1d8}
.hour-mark{width:29px;height:29px;margin:0 auto 7px;display:grid;place-items:center;border-radius:50%;
  color:#7d2685;background:#f7e7fb;border:1px solid #dfbfe6}
.hrs div.bad .hour-mark{color:#aaa097;background:#f1ede8;border-color:#e1dbd3}
.hour-mark .rz-ico{width:15px;height:15px}
.astro{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.astro>div{position:relative;min-height:110px;padding:15px 10px;text-align:center;border:1px solid #e1d1e4;border-radius:14px;
  background:linear-gradient(180deg,#fff,#fbf3ff)}
.astro b{display:block;color:#7a2a80;font-family:var(--ser);font-size:12px}
.astro span{display:block;margin-top:5px;color:#4d3b4e;font-size:13px;line-height:1.7}
.astro-mark{width:34px;height:34px;margin:0 auto 8px;display:grid;place-items:center;border-radius:50%;
  color:#a7791d;background:#fff8df;border:1px solid #e8c86f;box-shadow:0 5px 12px rgba(166,119,28,.09)}
.astro-mark.moon{color:#77408a;background:#f4eaff;border-color:#d8bee4}
.astro-mark .rz-ico{width:18px;height:18px}
.rz-icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
@media(max-width:430px){
  header{min-height:230px;padding:28px 22px;background-position:58% center}
  .jl-page-rz header h1{font-size:31px}
  .hero-kicker{max-width:175px;font-size:11px}
  .meta-grid{grid-template-columns:1fr 1fr;gap:8px}
  .meta-item{min-height:82px;padding:12px 11px}
  .meta-item{padding-right:45px}
  .pos div{min-height:108px}
  .hrs div{min-height:122px}
}
</style>

body.jl-page-rz .month-scene-copy{position:absolute;left:28px;top:25px;z-index:2;text-align:left;color:var(--month-ink)}

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};

var SX=['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
var ZHI='子丑寅卯辰巳午未申酉戌亥';
var HRNAME=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

/* 地支關係 */
function idx(z){return ZHI.indexOf(z);}
function liuhe(i){return (13-i)%12;}                 /* 子丑合、寅亥合… */
function chong(i){return (i+6)%12;}
function hai(i){return (19-i)%12;}                   /* 子未害、丑午害… */
var SANHE={0:[4,8],4:[8,0],8:[0,4],1:[5,9],5:[9,1],9:[1,5],
           2:[6,10],6:[10,2],10:[2,6],3:[7,11],7:[11,3],11:[3,7]};
var SANHUI={2:[3,4],3:[2,4],4:[2,3],5:[6,7],6:[5,7],7:[5,6],
            8:[9,10],9:[8,10],10:[8,9],11:[0,1],0:[11,1],1:[11,0]};
/* 三刑以「組」計：丑戌未、寅巳申；子卯相刑；辰午酉亥自刑 */
var XGRP=[[1,10,7],[2,5,8],[0,3]];
function xingOf(i){
  var out=[];
  XGRP.forEach(function(g){
    if(g.indexOf(i)>=0) g.forEach(function(x){ if(x!==i) out.push(x); });
  });
  return out;
}

function shengxiaoGroups(dz){
  var i=idx(dz); if(i<0)return null;
  var bad={}, add=function(o,k){o[k]=1;};
  add(bad,chong(i)); add(bad,hai(i));
  xingOf(i).forEach(function(x){ add(bad,x); });

  var good={};
  add(good,liuhe(i));
  (SANHE[i]||[]).forEach(function(x){ add(good,x); });
  Object.keys(bad).forEach(function(k){ delete good[k]; });

  var mid={}; add(mid,i);
  (SANHUI[i]||[]).forEach(function(x){ add(mid,x); });
  Object.keys(bad).forEach(function(k){ delete mid[k]; });
  Object.keys(good).forEach(function(k){ delete mid[k]; });

  var pick=function(o){return Object.keys(o).map(Number).sort(function(a,b){return a-b;})
    .map(function(x){return SX[x];});};
  return {good:pick(good), mid:pick(mid), bad:pick(bad)};
}

function safe(fn,dflt){ try{ var v=fn(); return (v==null||v==='')?dflt:v; }catch(e){ return dflt; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function tradDirection(s){return String(s||'').replace(/东/g,'東');}
function directionMark(s){return tradDirection(s).replace(/^正/,'')||'方';}
function ico(name,cls){return '<svg class="rz-ico'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#rz-i-'+name+'"></use></svg>';}
var MONTH_SCENES=[
  ['一月','寒梅映雪','stars','leaf'],['二月','春燈初暖','lantern','stars'],['三月','桃李春風','lotus','leaf'],
  ['四月','煙雨新綠','leaf','moon'],['五月','榴花端陽','lotus','sunrise'],['六月','荷風納涼','lotus','moon'],
  ['七月','星河流螢','stars','moon'],['八月','桂月清輝','moon','lotus'],['九月','金風桂影','leaf','moon'],
  ['十月','霜葉秋光','leaf','stars'],['十一月','蘆雪靜冬','moon','leaf'],['十二月','松雪歲暮','stars','moon']
];
function monthScene(month){var s=MONTH_SCENES[month-1]||MONTH_SCENES[0];return '<div class="month-scene"><div class="month-scene-copy"><small>SEASONAL ALMANAC</small><strong>'+s[0]+'</strong><span>'+s[1]+'</span></div><div class="month-scene-icons">'+ico(s[2])+ico(s[3])+'</div></div>';}
function metaItem(icon,label,value){return '<div class="meta-item"><i class="meta-visual">'+ico(icon)+'</i><b>'+label+'</b><span>'+value+'</span></div>';}
function detailItem(icon,label,value){if(!value||value==='—')return '';return '<div class="detail-row"><i class="detail-mark">'+ico(icon)+'</i><b>'+label+'</b><span>'+value+'</span></div>';}
function tagList(items){items=arr(items);return items.length?items.map(function(v){return '<span class="yj-tag">'+esc(v)+'</span>';}).join(''):'<span class="yj-tag">無</span>';}
function uniq(a){var o={};return (a||[]).filter(function(v){v=String(v||'').trim();if(!v||o[v])return false;o[v]=1;return true;});}
function arr(v){return Array.isArray(v)?v:(v?[v]:[]);}
function fmtTime(d){return d instanceof Date&&!isNaN(d.getTime())?pad(d.getHours())+':'+pad(d.getMinutes()):'—';}
function hijri(date){
  return safe(function(){return new Intl.DateTimeFormat('zh-TW-u-ca-islamic-civil',
    {year:'numeric',month:'long',day:'numeric'}).format(date);},'—');
}
function astronomy(date){
  if(typeof SunCalc==='undefined')return null;
  /* 預設臺北座標；時間為使用者裝置所在時區 */
  var lat=25.0330,lon=121.5654,t=SunCalc.getTimes(date,lat,lon),m=SunCalc.getMoonTimes(date,lat,lon);
  return {sunrise:fmtTime(t.sunrise),sunset:fmtTime(t.sunset),moonrise:fmtTime(m.rise),moonset:fmtTime(m.set)};
}

function render(date){
  var box=$('out');
  if(typeof Solar==='undefined'){
    box.innerHTML='<div class="card"><div class="err">農民曆元件沒有載入，請確認網路後重新整理。</div></div>';
    return;
  }
  var solar,lunar;
  try{
    solar=Solar.fromYmd(date.getFullYear(),date.getMonth()+1,date.getDate());
    lunar=solar.getLunar();
  }catch(e){
    box.innerHTML='<div class="card"><div class="err">這個日期算不出來，請換一天。</div></div>';
    return;
  }

  var week=['日','一','二','三','四','五','六'][date.getDay()];
  var lunStr=safe(function(){return lunar.getMonthInChinese()+'月'+lunar.getDayInChinese();},'');
  var gzY=safe(function(){return lunar.getYearInGanZhi();},'');
  var gzM=safe(function(){return lunar.getMonthInGanZhi();},'');
  var gzD=safe(function(){return lunar.getDayInGanZhi();},'');
  var dz=gzD?gzD.charAt(1):'';

  var solarFest=uniq(arr(safe(function(){return solar.getFestivals();},[])).concat(arr(safe(function(){return solar.getOtherFestivals();},[]))));
  var lunarFest=uniq(arr(safe(function(){return lunar.getFestivals();},[])).concat(arr(safe(function(){return lunar.getOtherFestivals();},[]))));
  var fotoFest=[];
  if(typeof Foto!=='undefined') fotoFest=uniq(arr(safe(function(){return Foto.fromLunar(lunar).getFestivals();},[])).concat(arr(safe(function(){return Foto.fromLunar(lunar).getOtherFestivals();},[]))));
  var xingzuo=safe(function(){return solar.getXingZuo();},'');
  var pengzu=uniq([safe(function(){return lunar.getPengZuGan();},''),safe(function(){return lunar.getPengZuZhi();},'')]);
  var jishen=arr(safe(function(){return lunar.getDayJiShen();},[]));
  var xiongsha=arr(safe(function(){return lunar.getDayXiongSha();},[]));
  var wuhou=safe(function(){return lunar.getWuHou();},'');
  var daylu=safe(function(){return lunar.getDayLu();},'');
  var daystar=safe(function(){var s=lunar.getDayNineStar();return s.getNumber()+' '+s.getColor()+' '+s.getName();},'');

  /* 節氣區間 */
  var jq='';
  jq=safe(function(){
    var p=lunar.getPrevJieQi(true), n=lunar.getNextJieQi(true);
    var ps=p.getSolar(), ns=n.getSolar();
    return p.getName()+' '+(ps.getMonth())+'/'+ps.getDay()+'　～　'
         + n.getName()+' '+(ns.getMonth())+'/'+ns.getDay();
  },'');

  var h='';
  var month=solar.getMonth(), monthInfo=MONTH_SCENES[month-1]||MONTH_SCENES[0];

  /* 日期主體 */
  h+='<div class="card rz-date-card rz-month-'+month+'">'+monthScene(month)+'<div class="date-main">'
   + '<div class="date-sol">'+solar.getYear()+' 年 '+solar.getMonth()+' 月 '
   + solar.getDay()+' 日　星期'+week+'</div>'
   + '<div class="date-lun">'+esc(lunStr)+'</div>'
   + '<div class="date-gz">'+esc(gzY)+'年　'+esc(gzM)+'月　'+esc(gzD)+'日</div>'
   + (jq?'<div class="date-jq">'+esc(jq)+'</div>':'')
   + '</div></div>';

  /* 日期總覽：全部隨選取日期更新 */
  h+='<div class="card rz-result-card rz-meta-card rz-month-'+month+'"><div class="month-chip">'+ico(monthInfo[2])+' '+monthInfo[0]+'・'+monthInfo[1]+'</div><h2><span class="rz-title-icon">'+ico('book')+'</span>黃 曆 總 覽</h2><div class="meta-grid">'
   + metaItem('leaf','本月節氣',jq?esc(jq):'—')
   + metaItem('crown','黃帝紀年','黃帝紀元 '+(solar.getYear()+2697)+' 年')
   + metaItem('lantern','當天節日',esc(uniq(solarFest.concat(lunarFest)).join('、')||'無特定節日'))
   + metaItem('lotus','佛教節日',esc(fotoFest.join('、')||'無特定佛教節日'))
   + metaItem('stars','星座',esc(xingzuo?xingzuo+'座':'—'))
   + metaItem('moon','回曆',esc(hijri(date)))
   + '</div></div>';

  /* 宜忌 */
  var yi=safe(function(){return lunar.getDayYi();},[]);
  var ji=safe(function(){return lunar.getDayJi();},[]);
  h+='<div class="card rz-result-card rz-yj-card"><h2><span class="rz-title-icon">'+ico('check')+'</span>今 日 宜 忌</h2><div class="yj">'
   + '<div class="y"><h3><i class="yj-mark">'+ico('check')+'</i>宜</h3><p>'+tagList(yi)+'</p></div>'
   + '<div class="j"><h3><i class="yj-mark">'+ico('ban')+'</i>忌</h3><p>'+tagList(ji)+'</p></div>'
   + '</div></div>';

  h+='<div class="card rz-result-card rz-detail-card"><h2><span class="rz-title-icon">'+ico('scroll')+'</span>老 黃 曆 詳 解</h2><div class="detail-list">'
   + detailItem('scroll','彭祖百忌',esc(pengzu.join('；')||'—'))
   + detailItem('crown','本日命祿',esc(daylu||'—'))
   + detailItem('stars','星曜',esc(daystar||'—'))
   + detailItem('lotus','吉神',esc(jishen.join('、')||'—'))
   + detailItem('ban','凶煞',esc(xiongsha.join('、')||'—'))
   + detailItem('leaf','本日物候',esc(wuhou||'—'))
   + '</div></div>';

  /* 方位 */
  var pos=[
    ['財神位', tradDirection(safe(function(){return lunar.getDayPositionCaiDesc();},''))],
    ['喜神位', tradDirection(safe(function(){return lunar.getDayPositionXiDesc();},''))],
    ['福神位', tradDirection(safe(function(){return lunar.getDayPositionFuDesc();},''))],
    ['貴神位', tradDirection(safe(function(){return lunar.getDayPositionYangGuiDesc();},''))]
  ].filter(function(p){return p[1];});
  if(pos.length){
    h+='<div class="card rz-result-card rz-pos-card"><h2><span class="rz-title-icon">'+ico('compass')+'</span>今 日 方 位</h2><div class="pos">';
    pos.forEach(function(p){
      h+='<div><i class="pos-mark">'+esc(directionMark(p[1]))+'</i><b>'+p[0]+'</b><span>'+esc(p[1])+'</span></div>';
    });
    h+='</div></div>';
  }

  /* 生肖 */
  var g=dz?shengxiaoGroups(dz):null;
  if(g){
    /* lunar 套件回傳簡體，改用日支自行推沖，不讓簡體字漏進頁面 */
    var chongSX=SX[chong(idx(dz))]||'';
    h+='<div class="card rz-result-card rz-sx-card"><h2><span class="rz-title-icon">'+ico('zodiac')+'</span>今 日 生 肖</h2><div class="sx">'
     + '<div class="t1" data-animal="'+esc(g.good.join(''))+'"><b>特吉</b><span>'+(g.good.join('　')||'—')+'</span></div>'
     + '<div class="t2" data-animal="'+esc(g.mid.join(''))+'"><b>次吉</b><span>'+(g.mid.join('　')||'—')+'</span></div>'
     + '<div class="t3" data-animal="'+esc(g.bad.join(''))+'"><b>帶衰</b><span>'+(g.bad.join('　')||'—')+'</span></div>'
     + '</div>'
     + '<div class="note">日支為 '+esc(dz)+'。特吉取六合與三合，帶衰取沖、刑、害'
     + (chongSX?('，本日沖'+esc(chongSX)):'')+'。</div></div>';
  }

  /* 吉時：自行以日支推青龍，不依賴套件的天神方法 */
  if(dz){
    var HR=[['子','23:00','00:59'],['丑','01:00','02:59'],['寅','03:00','04:59'],
            ['卯','05:00','06:59'],['辰','07:00','08:59'],['巳','09:00','10:59'],
            ['午','11:00','12:59'],['未','13:00','14:59'],['申','15:00','16:59'],
            ['酉','17:00','18:59'],['戌','19:00','20:59'],['亥','21:00','22:59']];
    /* 青龍起例：子午起申、丑未起戌、寅申起子、卯酉起寅、辰戌起辰、巳亥起午 */
    var QL={0:8,6:8, 1:10,7:10, 2:0,8:0, 3:2,9:2, 4:4,10:4, 5:6,11:6};
    /* 自青龍順數：青龍 明堂 天刑 朱雀 金匱 寶光 白虎 玉堂 天牢 玄武 司命 勾陳 */
    var SHEN=['青龍','明堂','天刑','朱雀','金匱','寶光','白虎','玉堂','天牢','玄武','司命','勾陳'];
    var HUANG={0:1,1:1,4:1,5:1,7:1,10:1};
    var start=QL[idx(dz)];
    if(start!=null){
      var goodCells='',badCells='',good=[];
      for(var k=0;k<12;k++){
        var off=(k-start+12)%12;
        var isJi=!!HUANG[off];
        if(isJi) good.push(HR[k][0]);
        var cell='<div class="hrs-cell '+(isJi?'':'bad')+'"><i class="hour-mark">'+ico('clock')+'</i><b>'+HR[k][0]+'時</b>'
             + '<span>'+HR[k][1]+'\u2013'+HR[k][2]+'</span>'
             + '<em>'+(isJi?'吉\u3000'+SHEN[off]:'一般時段')+'</em></div>';
        if(isJi)goodCells+=cell;else badCells+=cell;
      }
      h+='<div class="card rz-result-card rz-hours-card"><h2><span class="rz-title-icon">'+ico('clock')+'</span>今 日 吉 時</h2><div class="hrs hrs-good">'+goodCells+'</div>'
       + '<details class="hours-more"><summary>查看其餘 6 個時辰</summary><div class="hrs">'+badCells+'</div></details>'
       + '<div class="note">綠字為黃道吉時，共 '+good.length+' 個：'+good.join('、')+'時。<br>'
       + '以日支 '+esc(dz)+' 起青龍於 '+HR[start][0]+'時，順取青龍、明堂、金匱、寶光、玉堂、司命六黃道神。</div></div>';
    }
  }

  var ast=astronomy(date);
  if(ast){
    h+='<div class="card rz-result-card rz-astro-card"><h2><span class="rz-title-icon">'+ico('sunrise')+'</span>日 月 出 落</h2><div class="astro">'
     + '<div><i class="astro-mark">'+ico('sunrise')+'</i><b>日出時間</b><span>'+ast.sunrise+'</span></div><div><i class="astro-mark">'+ico('sunset')+'</i><b>日落時間</b><span>'+ast.sunset+'</span></div>'
     + '<div><i class="astro-mark moon">'+ico('moonrise')+'</i><b>月出時間</b><span>'+ast.moonrise+'</span></div><div><i class="astro-mark moon">'+ico('moonset')+'</i><b>月落時間</b><span>'+ast.moonset+'</span></div>'
     + '</div><div class="note">依臺北座標估算；實際時間會因所在地與地形略有差異。</div></div>';
  }

  box.innerHTML=h;
}

/* ---------- 介面 ---------- */
function pad(n){return (n<10?'0':'')+n;}
function toVal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromVal(v){
  var p=(v||'').split('-');
  if(p.length!==3)return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d.getTime())?null:d;
}

var today=new Date();
$('dt').value=toVal(today);

function show(d){ if(d){ $('dt').value=toVal(d); render(d); } }

$('go').addEventListener('click',function(){
  var d=fromVal($('dt').value);
  if(!d){ $('out').innerHTML='<div class="card"><div class="err">請先選一個日期。</div></div>'; return; }
  show(d);
});
[].forEach.call(document.querySelectorAll('.quick button'),function(b){
  b.addEventListener('click',function(){
    var d=new Date(); d.setDate(d.getDate()+ (+b.dataset.o));
    show(d);
  });
});

/* 等 CDN 載完再畫第一次 */
(function waitLib(n){
  if(typeof Solar!=='undefined'){ render(today); return; }
  if(n>40){ render(today); return; }
  setTimeout(function(){waitLib(n+1);},100);
})(0);

})();
</script>
