<main class="wrap">
<header class="top"><a class="brand" href="index.html"><i>筠</i>筠玲易數</a><a class="back" href="index.html?route=%E5%A5%87%E9%96%80">← 回奇門號碼</a></header>
<section class="hero"><small>QIMEN · 81 STEM COMBINATIONS</small><h1>奇門81格象意</h1><p>天盤九干 × 地盤九干，共81組十干克應。直接選擇組合，即可查看筠玲老師提供教材中的完整象意。</p><b id="data-count">資料檢查中</b></section>
<section class="panel">
<div class="head"><i>查</i><div><small>SELECT A COMBINATION</small><h2>選擇天盤與地盤</h2></div></div>
<div class="selectors"><div class="field"><label for="sky">天盤干</label><select id="sky"></select></div><div class="field"><label for="earth">地盤干</label><select id="earth"></select></div></div>
<div class="result" id="result" aria-live="polite"><div class="result-code"><b id="sky-badge">戊</b><span>天盤加地盤</span><b id="earth-badge">戊</b></div><h3 id="result-title">戊加戊</h3><p id="result-text"></p></div>
</section>
<section class="panel">
<div class="head"><i>81</i><div><small>COMPLETE MATRIX</small><h2>81格完整對照表</h2></div></div>
<div class="axis"><span><b>左側：</b>天盤干</span><span><b>上方：</b>地盤干</span></div>
<div class="matrix" id="matrix"></div>
<div class="note">閱讀方式：先看天盤干，再看地盤干。例如「天盤戊、地盤丙」即查「戊加丙」。象意仍需合參八門、九星、八神，以及門迫、入墓、擊刑，不宜只憑單一干象定吉凶。</div>
</section>
<footer class="footer">筠玲易數 · 奇門81格象意資料庫</footer>

<script src="data-qimen.js?v=qimen-81-complete-20260829"></script>
<script>
(function(){
'use strict';
var stems=['戊','乙','丙','丁','己','庚','辛','壬','癸'];
var data=(window.QMDATA&&window.QMDATA.classic)||{};
var sky=document.getElementById('sky'),earth=document.getElementById('earth'),matrix=document.getElementById('matrix');
stems.forEach(function(s){sky.add(new Option(s,s));earth.add(new Option(s,s));});
function key(){return sky.value+earth.value}
function render(){
 var k=key(),text=data[k]||'此組資料尚未建立。';
 document.getElementById('sky-badge').textContent=sky.value;
 document.getElementById('earth-badge').textContent=earth.value;
 document.getElementById('result-title').textContent=sky.value+'加'+earth.value;
 document.getElementById('result-text').textContent=text;
 matrix.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.key===k);});
 try{history.replaceState(null,'',location.pathname+'?key='+encodeURIComponent(k));}catch(e){}
}
function buildMatrix(){
 var h='<span class="corner">天＼地</span>';
 stems.forEach(function(s){h+='<span class="label">'+s+'</span>'});
 stems.forEach(function(a){
  h+='<span class="label">'+a+'</span>';
  stems.forEach(function(b){var k=a+b;h+='<button type="button" data-key="'+k+'" aria-label="'+a+'加'+b+'">'+a+b+'</button>'});
 });
 matrix.innerHTML=h;
 matrix.addEventListener('click',function(e){var b=e.target.closest('button[data-key]');if(!b)return;sky.value=b.dataset.key.charAt(0);earth.value=b.dataset.key.charAt(1);render();document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'});});
}
sky.addEventListener('change',render);earth.addEventListener('change',render);
buildMatrix();
var initial=new URLSearchParams(location.search).get('key');
if(initial&&data[initial]){sky.value=initial.charAt(0);earth.value=initial.charAt(1);}
var keys=stems.flatMap(function(a){return stems.map(function(b){return a+b})});
var complete=keys.filter(function(k){return data[k]}).length;
document.getElementById('data-count').textContent='已載入 '+complete+'／81 組'+(complete===81?' · 完整無缺漏':' · 尚有缺漏');
render();
})();
</script>
